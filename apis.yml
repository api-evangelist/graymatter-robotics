name: GrayMatter Robotics
description: 'GrayMatter Robotics is an American industrial AI and robotics company
  founded in 2020 by SK Gupta, Ariyan Kabir and Brual Shah, headquartered at a 100,000-square-foot
  AI Robotics Innovation Center in Carson, California. The company builds smart robotic
  cells for surface treatment and finishing in high-mix, high-variability manufacturing
  — sanding, grinding, polishing, buffing, blasting, spraying, trimming and AI-based
  dimensional inspection and defect detection — pairing off-the-shelf industrial robot
  arms, 3D scanners and tools with its own physics-informed AI stack (GMR-AI, marketed
  as Factory SuperIntelligence / FSI). Its flagship Scan&Sand cell 3D-scans each incoming
  part and generates the toolpath autonomously, so a cell can change over between parts
  in minutes without fixturing or teach-pendant programming, and the company claims
  4-12x throughput over manual finishing with 30-70% less consumable waste. GrayMatter
  sells robots-as-a-service on a monthly subscription that bundles hardware, software,
  training, remote monitoring and 24/7 support instead of an upfront capital purchase,
  and counts Boeing, Caterpillar and Oshkosh among its customers. It raised a $45M
  Series B in June 2024 led by Wellington Management with NGP Capital, Euclidean Capital,
  B Capital, 3M Ventures, Calibrate VC, OCA Ventures, Pathbreaker VC, Stage Venture
  Partners and Swift VC participating. GrayMatter Robotics is a robotics hardware and
  AI systems manufacturer: as of the August 2026 enrichment pass it publishes no public
  developer API, developer portal, SDK, CLI or machine-readable API contract (OpenAPI,
  AsyncAPI, GraphQL, gRPC), no MCP server and no A2A agent card. Note that this company
  is unrelated to greymatter.io, the service-mesh vendor with a similar name.'
